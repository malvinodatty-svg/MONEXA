# Reverse proxy CloudWallet
#   /      -> frontend (React build)
#   /api/  -> backend  (backend sudah menerima prefix /api, jadi path diteruskan apa adanya)
#
# "resolver" + variabel membuat nginx tetap hidup walau backend/frontend dimatikan
# (failure simulation) dan menemukan IP baru begitu container naik lagi.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        set $backend http://cloudwallet-backend:8000;
        proxy_pass $backend;               # tanpa URI => path asli (/api/...) diteruskan
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location / {
        set $frontend http://cloudwallet-frontend:80;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
