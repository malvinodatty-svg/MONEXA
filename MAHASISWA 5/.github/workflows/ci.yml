# Deployment automation (M5): setiap push/PR membangun seluruh stack dan menjalankan smoke test.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buat .env dengan secret acak
        run: ./scripts/setup-env.sh
      - name: Validasi compose
        run: docker compose config -q
      - name: Build & jalankan stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - name: Log jika gagal
        if: failure()
        run: docker compose logs --no-color
      - name: Matikan stack
        if: always()
        run: docker compose down -v
