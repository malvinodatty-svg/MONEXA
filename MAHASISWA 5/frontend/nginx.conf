# Nginx di dalam container frontend: menyajikan file statis hasil build.
# try_files diperlukan agar rute React Router (/login, /history, ...) tidak 404 saat di-refresh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
